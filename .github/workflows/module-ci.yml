# The CI every toolkit module runs: the module's own scripts/check, with every tool pinned, so the
# modules check alike. A module's .github/workflows/ci.yml calls it as its one job:
#   jobs:
#     test:
#       uses: seriouslysean/JigBoltgripToolkit/.github/workflows/module-ci.yml@<commit sha>
name: module-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1, LuaJIT, luacheck, busted, ShellCheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luajit luarocks
          sudo luarocks --lua-version 5.1 install luacheck 1.2.0-1
          sudo luarocks --lua-version 5.1 install busted 2.3.0-1
          # Release binaries by version and checksum; act runs this job on arm64, GitHub on x86_64.
          case "$(uname -m)" in
            x86_64) sc=linux.x86_64 sc_sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
              sf=linux_amd64 sf_sum=76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf ;;
            aarch64) sc=linux.aarch64 sc_sum=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588
              sf=linux_arm64 sf_sum=5f2db09dae91fca848f7adbdd014632e921a383863a2ad7e0450ad3aba0c6489 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.$sc.tar.xz"
          echo "$sc_sum  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          curl -fsSL -o shfmt "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_$sf"
          echo "$sf_sum  shfmt" | sha256sum -c -
          sudo install shfmt /usr/local/bin/shfmt
      - name: Check
        run: scripts/check
